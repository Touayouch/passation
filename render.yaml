services:
  - type: web
    name: passation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: COMINTY_API_KEY
        sync: false
      - key: COMINTY_USER_ID
        sync: false
      - key: COMINTY_AGENT_ID
        value: syhRMkNYmsmZ
